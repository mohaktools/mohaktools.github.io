<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Articles | MohakTools</title>
    <meta name="description" content="Simple guides on free online tools, calculations, and everyday tech by Mohak Choubey.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mohaktools.com/articles/">

    <meta property="og:title" content="Articles | MohakTools">
    <meta property="og:description" content="Simple guides on free online tools, calculations, and everyday tech by Mohak Choubey.">
    <meta property="og:url" content="https://mohaktools.com/articles/">

    <link rel="icon" href="/favicon.webp" type="image/webp">
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/themes.css">

    <style>
        .articles-page {
            width: min(860px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 72px;
            color: var(--color-text);
        }

        .articles-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .articles-breadcrumb a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color 180ms ease;
        }

        .articles-breadcrumb a:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .articles-intro {
            margin-bottom: 32px;
        }

        .articles-intro h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1.2;
            letter-spacing: -1px;
            color: var(--color-text);
        }

        .articles-intro p {
            max-width: 650px;
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-text-secondary);
        }

        .articles-list {
            display: grid;
            gap: 16px;
        }

        .article-card {
            display: block;
            padding: 22px 24px;
            color: var(--color-text);
            text-decoration: none;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg, 18px);
            box-shadow: 0 8px 28px var(--color-card-shadow);
            transition: border-color 180ms ease, transform 150ms ease;
        }

        .article-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .article-card:focus-visible {
            outline: 3px solid var(--color-primary);
            outline-offset: 3px;
        }

        .article-card h2 {
            margin: 0 0 8px;
            font-size: 20px;
            line-height: 1.35;
            letter-spacing: -0.3px;
            color: var(--color-text);
        }

        .article-card time {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .article-card p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: var(--color-text-secondary);
        }

        .articles-status {
            padding: 32px 0;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 15px;
        }

        .articles-status.error {
            color: var(--color-danger);
        }

        @media (max-width: 420px) {
            .articles-page {
                width: calc(100% - 24px);
            }

            .article-card {
                padding: 18px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .article-card {
                transition: none;
            }

            .article-card:hover {
                transform: none;
            }
        }
    </style>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Articles | MohakTools",
        "url": "https://mohaktools.com/articles/",
        "description": "Simple guides on free online tools, calculations, and everyday tech.",
        "author": {
            "@type": "Person",
            "name": "Mohak Choubey"
        }
    }
    </script>
</head>

<body>
    <script src="/assets/js/tools-registry.js" defer></script>

    <div id="site-header"></div>

    <main class="articles-page">
        <nav class="articles-breadcrumb" aria-label="Breadcrumb">
            <a href="/">Home</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Articles</span>
        </nav>

        <header class="articles-intro">
            <h1>Articles</h1>
            <p>
                Simple guides on calculations, free online tools, and
                everyday tech. Each article explains one topic step by step.
            </p>
        </header>

        <section aria-label="Article list">
            <div class="articles-list" id="articles-list">
                <p class="articles-status" role="status">Loading articles...</p>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/assets/js/theme.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/footer.js" defer></script>

    <script>
    (() => {
        "use strict";

        const list = document.getElementById("articles-list");

        function formatDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return value;
            }
            return date.toLocaleDateString("en-IN", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function showStatus(message, isError = false) {
            list.innerHTML = '<p class="articles-status' +
                (isError ? ' error' : '') +
                '" role="status">' + escapeHtml(message) + '</p>';
        }

        fetch("articles.json", { cache: "no-cache" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load articles");
                }
                return response.json();
            })
            .then(articles => {
                if (!Array.isArray(articles) || articles.length === 0) {
                    showStatus("Abhi koi article nahi hai.");
                    return;
                }

                articles.sort((a, b) => new Date(b.date) - new Date(a.date));

                list.innerHTML = articles.map(article => `
                    <a class="article-card" href="${escapeHtml(article.url)}">
                        <h2>${escapeHtml(article.title)}</h2>
                        <time datetime="${escapeHtml(article.date)}">${formatDate(article.date)}</time>
                        <p>${escapeHtml(article.description)}</p>
                    </a>
                `).join("");
            })
            .catch(() => {
                showStatus("Articles load nahi ho paaye. Thodi der baad try karo.", true);
            });
    })();
    </script>
</body>
</html>
