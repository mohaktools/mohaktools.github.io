<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20261116" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261116" />
  <link rel="shortcut icon" href="/favicon.ico?v=20261116" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261116" />
  <meta name="apple-mobile-web-app-title" content="MohakTools" />
  <link rel="manifest" href="/site.webmanifest?v=20261116" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Articles | MohakTools</title>
    <meta name="description" content="Simple guides on free online tools, calculations, and everyday tech by Mohak Choubey.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mohaktools.com/articles/">

    <meta property="og:title" content="Articles | MohakTools">
    <meta property="og:description" content="Simple guides on free online tools, calculations, and everyday tech by Mohak Choubey.">
    <meta property="og:url" content="https://mohaktools.com/articles/">

    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/themes.css">

    <style>
        .articles-page {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 72px;
            color: var(--color-text);
        }

        .articles-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .articles-breadcrumb a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color 180ms ease;
        }

        .articles-breadcrumb a:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .articles-intro { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 28px; margin-bottom: 30px; padding: clamp(24px, 5vw, 48px); overflow: hidden; background: linear-gradient(125deg, var(--color-surface), var(--color-surface-secondary)); border: 1px solid var(--color-border); border-radius: 24px; }
        .articles-intro-copy { position: relative; z-index: 1; max-width: 650px; }
        .articles-eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--color-primary); font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
        .articles-eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); content: ""; }
        .articles-intro-art { display: grid; width: 145px; height: 145px; flex: 0 0 145px; place-items: center; border: 1px solid var(--color-border); border-radius: 38px; background: var(--color-surface); color: var(--color-primary); transform: rotate(4deg); }
        .articles-intro-art svg { width: 76px; height: 76px; }

        .articles-intro h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1.2;
            letter-spacing: -1px;
            color: var(--color-text);
        }

        .articles-intro p {
            max-width: 650px;
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-text-secondary);
        }

        .articles-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 14px 20px; margin: 0 0 18px; }
        .articles-toolbar-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; grid-column: 1 / -1; }
        .articles-count { margin: 0; color: var(--color-text-secondary); font-size: 14px; }
        .articles-sort-control { display: flex; align-items: center; gap: 10px; color: var(--color-text-secondary); font-size: 13px; font-weight: 650; }
        .articles-sort { min-height: 42px; min-width: 205px; padding: 8px 36px 8px 12px; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; font: inherit; }
        .articles-search-control { display: grid; gap: 7px; color: var(--color-text-secondary); font-size: 13px; font-weight: 650; }
        .articles-search { width: 100%; min-height: 44px; padding: 10px 14px; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 11px; font: inherit; }
        .articles-search::placeholder { color: var(--color-text-secondary); opacity: .78; }
        .articles-search:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
        .articles-sort:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
        .articles-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

        .article-card {
            display: flex;
            min-height: 230px;
            flex-direction: column;
            padding: 22px 23px;
            color: var(--color-text);
            text-decoration: none;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg, 18px);
            box-shadow: 0 8px 28px var(--color-card-shadow);
            transition: border-color 180ms ease, transform 150ms ease, box-shadow 180ms ease;
        }

        .article-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 14px 32px var(--color-card-shadow);
        }

        .article-card:focus-visible {
            outline: 3px solid var(--color-primary);
            outline-offset: 3px;
        }

        .article-card h2 {
            margin: 0 0 8px;
            font-size: 20px;
            line-height: 1.35;
            letter-spacing: -0.3px;
            color: var(--color-text);
        }

        .article-card-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 17px; }
        .article-card-label, .article-reading-time { display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-secondary); font-size: 12px; }
        .article-card-label { padding: 5px 9px; color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 9%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-primary) 20%, var(--color-border)); border-radius: 999px; font-weight: 700; }

        .article-card p {
            flex: 1;
            margin: 0 0 21px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--color-text-secondary);
        }
        .article-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 13px; border-top: 1px solid var(--color-border); }
        .article-card time { color: var(--color-text-secondary); font-size: 12px; }
        .article-open-link { color: var(--color-primary); font-size: 13px; font-weight: 750; }

        .articles-status {
            padding: 32px 0;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 15px;
        }

        .articles-status.error {
            color: var(--color-danger);
        }

        @media (max-width: 420px) {
            .articles-page {
                width: calc(100% - 24px);
            }

            .article-card {
                padding: 18px 18px;
            }
        }
        @media (max-width: 680px) {
            .articles-intro { align-items: flex-start; }
            .articles-intro-art { width: 82px; height: 82px; flex-basis: 82px; border-radius: 24px; }
            .articles-intro-art svg { width: 45px; height: 45px; }
            .articles-list { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
            .articles-toolbar { grid-template-columns: 1fr; }
            .articles-toolbar-top { align-items: flex-start; flex-direction: column; }
            .articles-sort-control { width: 100%; justify-content: space-between; }
            .articles-sort { width: 100%; }
            .articles-intro-art { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .article-card {
                transition: none;
            }

            .article-card:hover {
                transform: none;
            }
        }
    </style>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Articles | MohakTools",
        "url": "https://mohaktools.com/articles/",
        "description": "Simple guides on free online tools, calculations, and everyday tech.",
        "author": {
            "@type": "Person",
            "name": "Mohak Choubey"
        }
    }
    </script>
</head>

<body>
    <script src="/assets/js/tools-registry.js" defer></script>

    <div id="site-header"></div>

    <main class="articles-page">
        <nav class="articles-breadcrumb" aria-label="Breadcrumb">
            <a href="/">Home</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Articles</span>
        </nav>

        <header class="articles-intro">
            <div class="articles-intro-copy">
              <span class="articles-eyebrow">MohakTools Journal</span>
              <h1>Useful reads for everyday questions.</h1>
              <p>Clear explanations for the things you need to work out, fix, or understand. Pick a topic and get to the useful part.</p>
            </div>
            <div class="articles-intro-art" aria-hidden="true">
              <svg viewBox="0 0 80 80" fill="none"><path d="M15 18.5c10.6-3 18.9-.5 25 4.4v40c-6.1-4.9-14.4-7.4-25-4.4v-40Zm50 0c-10.6-3-18.9-.5-25 4.4v40c6.1-4.9 14.4-7.4 25-4.4v-40Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M23 30h9m-9 8h9m17-8h9m-9 8h9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </div>
        </header>

        <section aria-label="Article list">
            <div class="articles-toolbar">
              <div class="articles-toolbar-top">
                <p class="articles-count" id="articles-count" aria-live="polite">Loading articles…</p>
                <label class="articles-sort-control" for="articles-sort">Sort by
                  <select class="articles-sort" id="articles-sort">
                    <option value="latest">Latest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="shortest">Shortest reading time</option>
                    <option value="longest">Longest reading time</option>
                  </select>
                </label>
              </div>
              <label class="articles-search-control" for="articles-search">Search articles
                <input class="articles-search" type="search" id="articles-search" placeholder="Try “calculator” or “password”" autocomplete="off">
              </label>
            </div>
            <div class="articles-list" id="articles-list">
                <p class="articles-status" role="status">Loading articles...</p>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/assets/js/theme.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/footer.js" defer></script>

    <script>
    (() => {
        "use strict";

        const list = document.getElementById("articles-list");
        const count = document.getElementById("articles-count");
        const searchInput = document.getElementById("articles-search");
        const sortSelect = document.getElementById("articles-sort");
        let allArticles = [];

        function formatDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return value;
            }
            return date.toLocaleDateString("en-IN", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function showStatus(message, isError = false) {
            list.innerHTML = '<p class="articles-status' +
                (isError ? ' error' : '') +
                '" role="status">' + escapeHtml(message) + '</p>';
        }

        function renderArticles() {
            const query = searchInput.value.trim().toLocaleLowerCase();
            const sortBy = sortSelect.value;
            const articles = allArticles.filter(article =>
                [article.title, article.description, article.url]
                    .some(value => String(value || "").toLocaleLowerCase().includes(query))
            );
            const dateValue = article => {
                const time = new Date(article.date).getTime();
                return Number.isNaN(time) ? 0 : time;
            };
            const readingTime = article => Math.max(1, Number(article.readingTimeMinutes) || 1);

            articles.sort((a, b) => {
                if (sortBy === "oldest") return dateValue(a) - dateValue(b);
                if (sortBy === "shortest") return readingTime(a) - readingTime(b) || dateValue(b) - dateValue(a);
                if (sortBy === "longest") return readingTime(b) - readingTime(a) || dateValue(b) - dateValue(a);
                return dateValue(b) - dateValue(a);
            });

            count.textContent = query
                ? `Showing ${articles.length} of ${allArticles.length} articles`
                : `${allArticles.length} ${allArticles.length === 1 ? "article" : "articles"}`;

            if (articles.length === 0) {
                showStatus("No articles match that search. Try another topic.");
                return;
            }

            list.innerHTML = articles.map(article => {
                const minutes = readingTime(article);
                return `
                    <a class="article-card" href="${escapeHtml(article.url)}">
                        <div class="article-card-meta">
                            <span class="article-card-label">MohakTools Guide</span>
                            <span class="article-reading-time" aria-label="${minutes} minute read">${minutes} min read</span>
                        </div>
                        <h2>${escapeHtml(article.title)}</h2>
                        <p>${escapeHtml(article.description)}</p>
                        <div class="article-card-footer">
                            <time datetime="${escapeHtml(article.date)}">${formatDate(article.date)}</time>
                            <span class="article-open-link">Read article <span aria-hidden="true">→</span></span>
                        </div>
                    </a>
                `;
            }).join("");
        }

        searchInput.addEventListener("input", renderArticles);
        sortSelect.addEventListener("change", renderArticles);

        fetch("articles.json", { cache: "no-cache" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load articles");
                }
                return response.json();
            })
            .then(articles => {
                if (!Array.isArray(articles) || articles.length === 0) {
                    showStatus("Abhi koi article nahi hai.");
                    return;
                }

                allArticles = articles;
                renderArticles();
            })
            .catch(() => {
                count.textContent = "";
                showStatus("Articles load nahi ho paaye. Thodi der baad try karo.", true);
            });
    })();
    </script>
</body>
</html>
