name: Deploy and Index HTML

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index-now:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed HTML URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}

        run: |
          BASE_URL=${SITE_URL%/}

          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No HTML files changed."
            exit 0
          fi

          URL_LIST=""
          for file in $CHANGED_FILES; do
            CLEAN_PATH=${file%index.html}
            FULL_URL="$BASE_URL/$CLEAN_PATH"
            URL_LIST="$URL_LIST\"$FULL_URL\","
          done

          URL_LIST="[${URL_LIST%,}]"

          HOST=$(echo "$BASE_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

          curl --fail -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"$HOST\",
              \"key\": \"$INDEXNOW_KEY\",
              \"keyLocation\": \"$BASE_URL/$INDEXNOW_KEY.txt\",
              \"urlList\": $URL_LIST
            }"
