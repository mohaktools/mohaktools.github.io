<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favicon Generator | MohakTools</title>
<meta name="description" content="Generate a favicon from text, emoji or an uploaded image.">
<meta name="keywords" content="favicon generator, site icon, browser tab icon">
<link rel="canonical" href="https://mohaktools.com/tools/favicon-generator/">
<meta property="og:title" content="Favicon Generator | MohakTools">
<meta property="og:description" content="Generate a favicon from text, emoji or an uploaded image.">
<meta property="og:url" content="https://mohaktools.com/tools/favicon-generator/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MohakTools">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Favicon Generator | MohakTools">
<meta name="twitter:description" content="Generate a favicon from text, emoji or an uploaded image.">
<script src="/assets/js/tools-registry.js" defer></script>
<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=developer-tools" style="color:var(--color-primary);text-decoration:none">Developer Tools</a>
    <span style="margin:0 6px">/</span>
    <span>Favicon Generator</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Favicon Generator</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Generate a favicon from text, emoji or an uploaded image.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Favicon Generator</h2>
<div class="mt-field"><label for="f0">Mode</label>
<select id="f0"><option value="emoji">Emoji / Text</option><option value="upload">Upload Image</option></select></div>
<div id="emoji-row" class="mt-field"><label for="f1">Text or Emoji</label><input type="text" id="f1" placeholder="🚀" maxlength="4" style="font-size:24px;text-align:center"></div>
<div id="upload-row" class="mt-field" hidden><label for="f2">Image File</label><input type="file" id="f2" accept="image/*"></div>
<div class="mt-field"><label for="f3">Background Color</label><input type="color" id="f3" value="#ffffff"></div>
<div class="mt-field"><label for="f4">Size</label>
<select id="f4"><option value="16">16×16</option><option value="32" selected>32×32</option><option value="48">48×48</option><option value="64">64×64</option><option value="128">128×128</option></select></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Generate</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Preview & Download</h2>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<canvas id="fav-canvas" width="64" height="64" style="border:1px solid var(--color-border);border-radius:6px;image-rendering:pixelated"></canvas>
<div>
<p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Preview (scaled up)</p>
<button class="mt-button mt-primary" id="dlbtn" disabled>Download .ico / .png</button>
</div>
</div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Developer Tools</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/json-formatter/" class="mt-related-chip">JSON Formatter</a><a href="/tools/base64-encoder-decoder/" class="mt-related-chip">Base64 Encoder/Decoder</a><a href="/tools/url-encoder-decoder/" class="mt-related-chip">URL Encoder/Decoder</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("f0").onchange=function(){document.getElementById("emoji-row").hidden=this.value!=="emoji";document.getElementById("upload-row").hidden=this.value!=="upload";};
document.getElementById("calc").onclick=()=>{
  const size=+document.getElementById("f4").value,bg=document.getElementById("f3").value,mode=document.getElementById("f0").value;
  const canvas=document.getElementById("fav-canvas");canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
  if(mode==="emoji"){
    const text=document.getElementById("f1").value||"🔧";
    ctx.font=`${size*.75}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(text,size/2,size/2);
    document.getElementById("dlbtn").disabled=false;document.getElementById("mt-status").textContent="Favicon ready!";
  } else {
    const file=document.getElementById("f2").files[0];
    if(!file){document.getElementById("mt-status").textContent="Select an image file.";return;}
    const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,size,size);document.getElementById("dlbtn").disabled=false;document.getElementById("mt-status").textContent="Favicon ready!";};
    img.src=URL.createObjectURL(file);
  }
};
document.getElementById("dlbtn").onclick=()=>{const a=document.createElement("a");a.download="favicon.png";a.href=document.getElementById("fav-canvas").toDataURL("image/png");a.click();};
</script>
</body>
</html>
