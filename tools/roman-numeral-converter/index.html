<section class="mt-panel"><h2 id="tool-input-heading">Convert</h2>

<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Convert</button><button class="mt-button mt-secondary" id="reset">Clear</button></div>

<script src="/assets/js/footer.js" defer></script>
<script>

const VAL={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
const PAIRS=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
function toRoman(n){let r="";for(const[v,s]of PAIRS){while(n>=v){r+=s;n-=v;}}return r;}
function fromRoman(s){let r=0;const u=s.toUpperCase();for(let i=0;i<u.length;i++){const c=VAL[u[i]]||0,n=VAL[u[i+1]]||0;r+=c<n?-c:c;}return r;}
document.getElementById("calc").onclick=()=>{
  const inp=document.getElementById("f0").value.trim();
  if(!inp){document.getElementById("mt-status").textContent="Enter a value.";return;}
  if(/^\d+$/.test(inp)){const n=+inp;if(n<1||n>3999){document.getElementById("mt-status").textContent="Enter a number between 1 and 3999.";return;}
    document.getElementById("roman").textContent=toRoman(n);document.getElementById("arabic").textContent=n;}
  else{const n=fromRoman(inp);document.getElementById("arabic").textContent=n;document.getElementById("roman").textContent=inp.toUpperCase();}
  document.getElementById("mt-status").textContent="";
};
document.getElementById("reset").onclick=()=>{document.getElementById("f0").value="";["roman","arabic"].forEach(id=>document.getElementById(id).textContent="—");};
</script>
