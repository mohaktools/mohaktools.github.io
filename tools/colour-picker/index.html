<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=everyday-utilities" style="color:var(--color-primary);text-decoration:none">Everyday Utilities</a>
    <span style="margin:0 6px">/</span>
    <span>Colour Picker</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Colour Picker</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Pick any colour from the wheel and get HEX, RGB and HSL values.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Colour Picker</h2>
<div style="text-align:center;margin-bottom:16px">
<input type="color" id="picker" value="#667eea" style="width:120px;height:120px;border:none;border-radius:16px;cursor:pointer;padding:0;background:none">
</div>
<div class="mt-field"><label for="hexin">HEX</label><input type="text" id="hexin" placeholder="#667eea" style="font-family:monospace" maxlength="7"></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="fromhex">Apply HEX</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Colour Values</h2>
<div id="swatch" style="height:80px;border-radius:10px;margin-bottom:12px;border:1px solid var(--color-border)"></div>
<div class="mt-stat-grid">
<div class="mt-stat"><span>HEX</span><strong id="hex-out" style="font-family:monospace">—</strong></div>
<div class="mt-stat"><span>RGB</span><strong id="rgb-out" style="font-family:monospace">—</strong></div>
<div class="mt-stat"><span>HSL</span><strong id="hsl-out" style="font-family:monospace">—</strong></div>
<div class="mt-stat"><span>CSS Variable</span><strong id="css-out" style="font-family:monospace;font-size:12px">—</strong></div>
</div>
<div class="mt-button-row" style="margin-top:10px"><button class="mt-button mt-secondary" id="copyhex">Copy HEX</button><button class="mt-button mt-secondary" id="copyrgb">Copy RGB</button><button class="mt-button mt-secondary" id="copyhsl">Copy HSL</button></div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Everyday Utilities</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/password-generator/" class="mt-related-chip">Password Generator</a><a href="/tools/qr-code-generator/" class="mt-related-chip">QR Code Generator</a><a href="/tools/random-number-generator/" class="mt-related-chip">Random Number Generator</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;
if(max===min){h=s=0;}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;}}
return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function update(hex){
  const{r,g,b}=hexToRgb(hex);const{h,s,l}=rgbToHsl(r,g,b);
  document.getElementById("swatch").style.background=hex;
  document.getElementById("hex-out").textContent=hex.toUpperCase();
  document.getElementById("rgb-out").textContent=`rgb(${r}, ${g}, ${b})`;
  document.getElementById("hsl-out").textContent=`hsl(${h}, ${s}%, ${l}%)`;
  document.getElementById("css-out").textContent=`--color: ${hex};`;
  document.getElementById("hexin").value=hex;
}
document.getElementById("picker").addEventListener("input",function(){update(this.value);});
document.getElementById("fromhex").onclick=()=>{const h=document.getElementById("hexin").value.trim();if(/^#[0-9a-f]{6}$/i.test(h)){document.getElementById("picker").value=h;update(h);}else document.getElementById("mt-status").textContent="Enter a valid 6-digit hex colour.";};
document.getElementById("copyhex").onclick=()=>navigator.clipboard.writeText(document.getElementById("hex-out").textContent).then(()=>document.getElementById("mt-status").textContent="HEX copied!");
document.getElementById("copyrgb").onclick=()=>navigator.clipboard.writeText(document.getElementById("rgb-out").textContent).then(()=>document.getElementById("mt-status").textContent="RGB copied!");
document.getElementById("copyhsl").onclick=()=>navigator.clipboard.writeText(document.getElementById("hsl-out").textContent).then(()=>document.getElementById("mt-status").textContent="HSL copied!");
update("#667eea");
</script>
</body>
</html>
