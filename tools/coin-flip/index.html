.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}

<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=everyday-utilities" style="color:var(--color-primary);text-decoration:none">Everyday Utilities</a>
    <span style="margin:0 6px">/</span>
    <span>Coin Flip</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Coin Flip</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Flip a virtual coin and get heads or tails with animation.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Flip a Coin</h2>
<div class="mt-field"><label for="f0">Number of Flips</label><input type="number" id="f0" value="1" min="1" max="1000"></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Flip!</button><button class="mt-button mt-secondary" id="reset">Reset</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Result</h2>
<div style="text-align:center;padding:20px 0"><div id="coin" style="font-size:80px;transition:transform .3s">🪙</div></div>
<div class="mt-stat-grid">
<div class="mt-stat"><span>Result</span><strong id="result" style="font-size:28px">—</strong></div>
<div class="mt-stat"><span>Heads</span><strong id="heads">—</strong></div>
<div class="mt-stat"><span>Tails</span><strong id="tails">—</strong></div>
<div class="mt-stat"><span>Ratio</span><strong id="ratio">—</strong></div>
</div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Everyday Utilities</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/password-generator/" class="mt-related-chip">Password Generator</a><a href="/tools/qr-code-generator/" class="mt-related-chip">QR Code Generator</a><a href="/tools/random-number-generator/" class="mt-related-chip">Random Number Generator</a></div>
  </section>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("calc").onclick=()=>{
  const n=+document.getElementById("f0").value||1;
  const coin=document.getElementById("coin");
  coin.style.transform="rotateY(360deg)";setTimeout(()=>{coin.style.transform="rotateY(0)";},300);
  let heads=0,tails=0;
  for(let i=0;i<n;i++){Math.random()<.5?heads++:tails++;}
  const last=Math.random()<.5?"Heads":"Tails";
  if(n===1){coin.textContent=last==="Heads"?"👑":"🦅";}
  document.getElementById("result").textContent=n===1?last:(heads>tails?"More Heads":"More Tails");
  document.getElementById("heads").textContent=heads+(n>1?" ("+Math.round(heads/n*100)+"%)":"");
  document.getElementById("tails").textContent=tails+(n>1?" ("+Math.round(tails/n*100)+"%)":"");
  document.getElementById("ratio").textContent=n>1?heads+":"+tails:"—";
  document.getElementById("mt-status").textContent="";
};
document.getElementById("reset").onclick=()=>{document.getElementById("coin").textContent="🪙";["result","heads","tails","ratio"].forEach(id=>document.getElementById(id).textContent="—");};
</script>
</body>
