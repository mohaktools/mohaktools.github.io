<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
<title>Find and Replace | MohakTools</title>
<meta name="description" content="Find text and replace it with plain or regex-powered substitution.">
<meta name="keywords" content="find and replace, text substitution, regex replace">
<link rel="canonical" href="https://mohaktools.com/tools/find-and-replace/">
<meta property="og:title" content="Find and Replace | MohakTools">
<meta property="og:description" content="Find text and replace it with plain or regex-powered substitution.">
<meta property="og:url" content="https://mohaktools.com/tools/find-and-replace/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MohakTools">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Find and Replace | MohakTools">
<meta name="twitter:description" content="Find text and replace it with plain or regex-powered substitution.">
<script src="/assets/js/tools-registry.js" defer></script>
<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=text-tools" style="color:var(--color-primary);text-decoration:none">Text Tools</a>
    <span style="margin:0 6px">/</span>
    <span>Find and Replace</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Find and Replace</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Find text and replace it with plain or regex-powered substitution.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Text</h2>
<div class="mt-field"><label for="mt-input">Input Text</label><textarea id="mt-input" placeholder="Paste text here…"></textarea></div>
<div class="mt-field"><label for="findTxt">Find</label><input type="text" id="findTxt" placeholder="Text to find"></div>
<div class="mt-field"><label for="replTxt">Replace with</label><input type="text" id="replTxt" placeholder="Replacement text"></div>
<div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap">
<label class="mt-option"><input type="checkbox" id="useRegex"> Regex</label>
<label class="mt-option"><input type="checkbox" id="caseSens"> Case sensitive</label>
<label class="mt-option"><input type="checkbox" id="wholeWord"> Whole word</label>
</div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Replace All</button><button class="mt-button mt-secondary" id="copy">Copy Result</button><button class="mt-button mt-secondary" id="reset">Clear</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Output</h2>
<textarea id="mt-output" class="mt-output" readonly></textarea></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Text Tools</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/word-counter/" class="mt-related-chip">Word Counter</a><a href="/tools/character-counter/" class="mt-related-chip">Character Counter</a><a href="/tools/case-converter/" class="mt-related-chip">Case Converter</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("calc").onclick=()=>{
  let text=document.getElementById("mt-input").value;
  let find=document.getElementById("findTxt").value,repl=document.getElementById("replTxt").value;
  if(!find){document.getElementById("mt-status").textContent="Enter text to find.";return;}
  const isRe=document.getElementById("useRegex").checked,cs=document.getElementById("caseSens").checked,ww=document.getElementById("wholeWord").checked;
  let count=0;
  try{
    let pat=isRe?find:find.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    if(ww)pat="\\b"+pat+"\\b";
    const re=new RegExp(pat,cs?"g":"gi");
    const out=text.replace(re,m=>{count++;return repl;});
    document.getElementById("mt-output").value=out;
    document.getElementById("mt-status").textContent=count+" replacement(s) made.";
  }catch(e){document.getElementById("mt-status").textContent="Regex error: "+e.message;}
};
document.getElementById("copy").onclick=()=>{const o=document.getElementById("mt-output").value;if(o)navigator.clipboard.writeText(o).then(()=>document.getElementById("mt-status").textContent="Copied!");};
document.getElementById("reset").onclick=()=>{document.getElementById("mt-input").value="";document.getElementById("mt-output").value="";};
</script>
</body>
</html>
