<script>

document.getElementById("today").onclick=()=>document.getElementById("f1").value=new Date().toISOString().split("T")[0];
function solarCalc(lat,lon,date){
  const rad=Math.PI/180,d=new Date(date);
  const n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  const B=(360/365)*(n-81)*rad,E=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const TC=4*(lon-82.5)+E;const declination=23.45*Math.sin((360/365)*(n-81)*rad)*rad;
  const HA=Math.acos(-Math.tan(lat*rad)*Math.tan(declination))/rad;
  const sr=12-HA/15-TC/60,ss=12+HA/15-TC/60;
  return{sr,ss,noon:12-TC/60,dl:(ss-sr)};
}
function fmt(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);const ampm=hh<12?"AM":"PM";return(hh%12||12)+":"+String(mm).padStart(2,"0")+" "+ampm;}
document.getElementById("calc").onclick=()=>{
  const [lat,lon]=document.getElementById("f0").value.split(",").map(Number),date=document.getElementById("f1").value;
  if(!date){document.getElementById("mt-status").textContent="Select a date.";return;}
  const {sr,ss,noon,dl}=solarCalc(lat,lon,date);
  document.getElementById("sr").textContent=fmt(sr);
  document.getElementById("ss").textContent=fmt(ss);
  document.getElementById("dl").textContent=Math.floor(dl)+"h "+Math.round((dl%1)*60)+"m";
  document.getElementById("sn").textContent=fmt(noon);
  document.getElementById("mt-status").textContent="Approximate values for IST (UTC+5:30).";
};
</script>
