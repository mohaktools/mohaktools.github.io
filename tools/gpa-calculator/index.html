<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
<title>GPA Calculator | MohakTools</title>
<meta name="description" content="Calculate GPA from grades and credit hours.">
<meta name="keywords" content="GPA calculator, grade point average, CGPA">
<link rel="canonical" href="https://mohaktools.com/tools/gpa-calculator/">
<meta property="og:title" content="GPA Calculator | MohakTools">
<meta property="og:description" content="Calculate GPA from grades and credit hours.">
<meta property="og:url" content="https://mohaktools.com/tools/gpa-calculator/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MohakTools">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="GPA Calculator | MohakTools">
<meta name="twitter:description" content="Calculate GPA from grades and credit hours.">
<script src="/assets/js/tools-registry.js" defer></script>
<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=calculators" style="color:var(--color-primary);text-decoration:none">Calculators</a>
    <span style="margin:0 6px">/</span>
    <span>GPA Calculator</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">GPA Calculator</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Calculate GPA from grades and credit hours.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Course Grades</h2>
<div id="rows">
<div class="gpa-row mt-field" style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end">
<div><label>Grade (A/B+/…)</label><input type="text" class="ggrade" placeholder="A" maxlength="3" style="display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-input-bg,var(--color-surface));color:var(--color-text);font:inherit;outline:none"></div>
<div><label>Credits</label><input type="number" class="gcred" placeholder="3" min="0" max="10" style="display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-input-bg,var(--color-surface));color:var(--color-text);font:inherit;outline:none"></div>
<button type="button" class="mt-button mt-secondary" style="margin-top:24px" onclick="this.closest('.gpa-row').remove()">✕</button></div>
</div>
<div class="mt-button-row" style="margin-top:10px">
<button class="mt-button mt-secondary" type="button" id="addrow">+ Add Course</button>
<button class="mt-button mt-primary" type="button" id="calc">Calculate GPA</button>
<button class="mt-button mt-secondary" type="button" id="reset">Reset</button>
</div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Result</h2>
<div class="mt-stat-grid">
<div class="mt-stat"><span>GPA (10-point)</span><strong id="gpa">—</strong></div>
<div class="mt-stat"><span>GPA (4-point)</span><strong id="gpa4">—</strong></div>
<div class="mt-stat"><span>Total Credits</span><strong id="credits">—</strong></div>
</div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Calculators</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/calculator/" class="mt-related-chip">Basic Calculator</a><a href="/tools/percentage-calculator/" class="mt-related-chip">Percentage Calculator</a><a href="/tools/gst-calculator/" class="mt-related-chip">GST Calculator</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

const GRADE={O:10,"A+":10,A:9,"B+":8,B:7,"C+":6,C:5,D:4,F:0,
  "A":9,"A-":9,"B":8,"B-":7,"C":6,"C-":5,"D+":4};
document.getElementById("addrow").onclick=()=>{
  const row=document.createElement("div");
  row.className="gpa-row mt-field";row.style.cssText="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end";
  row.innerHTML=`<div><label>Grade</label><input type="text" class="ggrade" placeholder="A" maxlength="3" style="display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-input-bg,var(--color-surface));color:var(--color-text);font:inherit;outline:none"></div>
<div><label>Credits</label><input type="number" class="gcred" placeholder="3" min="0" style="display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-input-bg,var(--color-surface));color:var(--color-text);font:inherit;outline:none"></div>
<button type="button" class="mt-button mt-secondary" style="margin-top:24px" onclick="this.closest('.gpa-row').remove()">✕</button>`;
  document.getElementById("rows").appendChild(row);
};
document.getElementById("calc").onclick=()=>{
  const grades=[...document.querySelectorAll(".ggrade")];
  const credits=[...document.querySelectorAll(".gcred")];
  let pts=0,cr=0;
  for(let i=0;i<grades.length;i++){
    const g=grades[i].value.trim().toUpperCase(),c=+credits[i].value;
    const gp=GRADE[g];
    if(gp===undefined){document.getElementById("mt-status").textContent=`Unknown grade "${g}". Use O/A+/A/B+/B/C+/C/D/F.`;return;}
    pts+=gp*c;cr+=c;
  }
  if(!cr){document.getElementById("mt-status").textContent="Add at least one course.";return;}
  const gpa=pts/cr;
  document.getElementById("gpa").textContent=gpa.toFixed(2);
  document.getElementById("gpa4").textContent=(gpa/10*4).toFixed(2);
  document.getElementById("credits").textContent=cr;
  document.getElementById("mt-status").textContent="";
};
document.getElementById("reset").onclick=()=>{document.getElementById("rows").innerHTML="";document.getElementById("gpa").textContent=document.getElementById("gpa4").textContent=document.getElementById("credits").textContent="—";};
</script>
</body>
</html>
