<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
<title>Regex Tester | MohakTools</title>
<meta name="description" content="Test and debug regular expressions with live match highlighting.">
<meta name="keywords" content="regex tester, regular expression, regex debugger">
<link rel="canonical" href="https://mohaktools.com/tools/regex-tester/">
<meta property="og:title" content="Regex Tester | MohakTools">
<meta property="og:description" content="Test and debug regular expressions with live match highlighting.">
<meta property="og:url" content="https://mohaktools.com/tools/regex-tester/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MohakTools">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Regex Tester | MohakTools">
<meta name="twitter:description" content="Test and debug regular expressions with live match highlighting.">
<script src="/assets/js/tools-registry.js" defer></script>
<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=developer-tools" style="color:var(--color-primary);text-decoration:none">Developer Tools</a>
    <span style="margin:0 6px">/</span>
    <span>Regex Tester</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Regex Tester</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Test and debug regular expressions with live match highlighting.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Regex Pattern</h2>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
<span style="font-size:20px;color:var(--color-text-secondary)">/</span>
<input type="text" id="pattern" placeholder="[a-z]+" style="flex:1;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:monospace 14px;outline:none">
<span style="font-size:20px;color:var(--color-text-secondary)">/</span>
<input type="text" id="flags" placeholder="gi" maxlength="6" style="width:60px;padding:10px 8px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:monospace 14px;outline:none">
</div>
<div class="mt-field"><label for="mt-input">Test String</label><textarea id="mt-input" placeholder="Enter text to test your regex against…" style="min-height:140px"></textarea></div>
<div class="mt-field"><label for="repl">Replace with (optional)</label><input type="text" id="repl" placeholder="Replacement string ($1, $2 for groups)" style="font-family:monospace"></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Test</button><button class="mt-button mt-secondary" id="reset">Clear</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Results</h2>
<div id="highlight-out" style="font-family:monospace;font-size:14px;line-height:1.8;min-height:80px;padding:12px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface-secondary);white-space:pre-wrap;word-break:break-all;margin-bottom:12px"></div>
<div id="matches-list" style="display:flex;flex-direction:column;gap:6px"></div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Developer Tools</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/json-formatter/" class="mt-related-chip">JSON Formatter</a><a href="/tools/base64-encoder-decoder/" class="mt-related-chip">Base64 Encoder/Decoder</a><a href="/tools/url-encoder-decoder/" class="mt-related-chip">URL Encoder/Decoder</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("calc").onclick=()=>{
  const pat=document.getElementById("pattern").value,flags=document.getElementById("flags").value,text=document.getElementById("mt-input").value;
  if(!pat){document.getElementById("mt-status").textContent="Enter a pattern.";return;}
  try{
    const re=new RegExp(pat,flags||"g");
    const matches=[...text.matchAll(new RegExp(pat,flags.includes("g")?flags:flags+"g"))];
    // Highlight
    const hiEl=document.getElementById("highlight-out");
    let last=0,hi="";
    matches.forEach(m=>{
      hi+=text.slice(last,m.index).replace(/&/g,"&amp;").replace(/</g,"&lt;");
      hi+=`<mark style="background:rgba(var(--color-primary-rgb,72,134,232),.3);border-radius:3px">${m[0].replace(/&/g,"&amp;").replace(/</g,"&lt;")}</mark>`;
      last=m.index+m[0].length;
    });
    hi+=text.slice(last).replace(/&/g,"&amp;").replace(/</g,"&lt;");
    hiEl.innerHTML=hi||text.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    // Matches list
    const ml=document.getElementById("matches-list");
    if(!matches.length){ml.innerHTML=`<p style="color:var(--color-text-secondary)">No matches found.</p>`;}
    else{
      ml.innerHTML=matches.slice(0,30).map((m,i)=>`<div style="padding:6px 10px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface);font-family:monospace;font-size:12px"><span style="color:var(--color-text-secondary)">Match ${i+1} @ index ${m.index}:</span> <strong>${m[0]}</strong>${m.slice(1).length?" | Groups: "+m.slice(1).join(", "):""}</div>`).join("");
    }
    // Replace
    const repl=document.getElementById("repl").value;
    const replaced=repl!==undefined&&repl!==""?text.replace(new RegExp(pat,flags.includes("g")?flags:flags+"g"),repl):"";
    document.getElementById("mt-status").textContent=matches.length+" match(es)."+( replaced?" Replaced version shown below.":"");
    if(replaced){const ta=document.createElement("textarea");ta.id="mt-output";ta.className="mt-output";ta.readOnly=true;ta.style.fontFamily="monospace";ta.value=replaced;if(!document.getElementById("mt-output"))ml.after(ta);else document.getElementById("mt-output").value=replaced;}
  }catch(e){document.getElementById("mt-status").textContent="Regex error: "+e.message;}
};
document.getElementById("reset").onclick=()=>{document.getElementById("pattern").value="";document.getElementById("mt-input").value="";document.getElementById("highlight-out").innerHTML="";document.getElementById("matches-list").innerHTML="";};
</script>
</body>
</html>
