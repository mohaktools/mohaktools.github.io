<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">

    <span style="margin:0 6px">/</span>
    <span>PDF Merge / Split</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">PDF Merge / Split</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Merge multiple PDFs or split one PDF into separate files.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">PDF Merge / Split</h2>
<div class="mt-field"><label for="f0">Select PDF File(s)</label><input type="file" id="f0" accept="application/pdf" multiple></div>
<div class="mt-field"><label for="f1">Mode</label>
<select id="f1">
<option value="merge">Merge multiple PDFs into one</option>
<option value="split">Split PDF into individual pages</option>
</select></div>
<div id="split-opts" class="mt-field" hidden><label for="f2">Page range to extract (e.g. 1-3, 5)</label><input type="text" id="f2" placeholder="1-3, 5, 7-9"></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Process</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Output</h2>
<div id="pdf-result" style="color:var(--color-text-secondary);font-size:14px">Select files and click Process.</div></section>
  </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/password-generator/" class="mt-related-chip">Password Generator</a><a href="/tools/qr-code-generator/" class="mt-related-chip">QR Code Generator</a><a href="/tools/random-number-generator/" class="mt-related-chip">Random Number Generator</a></div>

<script src="/assets/js/footer.js" defer></script>
<script>

const PDFLIB_SRC="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
document.getElementById("f1").onchange=function(){document.getElementById("split-opts").hidden=this.value!=="split";};
function loadLib(src){return new Promise((res,rej)=>{if(window.PDFLib)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function readPDF(file){return await file.arrayBuffer();}
document.getElementById("calc").onclick=async()=>{
  const files=[...document.getElementById("f0").files],mode=document.getElementById("f1").value;
  if(!files.length){document.getElementById("mt-status").textContent="Select PDF file(s).";return;}
  document.getElementById("mt-status").textContent="Loading PDF library…";
  await loadLib(PDFLIB_SRC);
  const {PDFDocument}=window.PDFLib;
  try{
    if(mode==="merge"){
      if(files.length<2){document.getElementById("mt-status").textContent="Select 2+ PDFs to merge.";return;}
      const merged=await PDFDocument.create();
      for(const f of files){const buf=await readPDF(f);const pdf=await PDFDocument.load(buf);const pages=await merged.copyPages(pdf,pdf.getPageIndices());pages.forEach(p=>merged.addPage(p));}
      const bytes=await merged.save();
      const blob=new Blob([bytes],{type:"application/pdf"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="merged.pdf";a.click();
      document.getElementById("mt-status").textContent="Merged PDF downloaded!";
    } else {
      const buf=await readPDF(files[0]);const pdf=await PDFDocument.load(buf);const total=pdf.getPageCount();
      const rangeStr=document.getElementById("f2").value||"1-"+total;
      const pages=new Set();
      rangeStr.split(",").forEach(part=>{const m=part.trim().match(/^(\d+)(?:-(\d+))?$/);if(m){const s=+m[1],e=m[2]?+m[2]:s;for(let i=s;i<=Math.min(e,total);i++)pages.add(i-1);}});
      if(!pages.size){document.getElementById("mt-status").textContent="No valid pages in range.";return;}
      const out=await PDFDocument.create();const copied=await out.copyPages(pdf,[...pages]);copied.forEach(p=>out.addPage(p));
      const bytes=await out.save();
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download="extracted.pdf";a.click();
      document.getElementById("mt-status").textContent="Extracted "+pages.size+" page(s). PDF downloaded!";
    }
  }catch(e){document.getElementById("mt-status").textContent="Error: "+e.message;}
};
</script>
