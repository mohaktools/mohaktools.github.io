<div class="mt-field"><label for="f1">System</label>
<select id="f1"><option value="us_m">US Men</option><option value="us_w">US Women</option><option value="uk">UK</option><option value="eu">EU</option><option value="cm">Foot Length (cm)</option></select></div>

<script>

// Convert via foot length in cm
function toCm(v,sys){
  if(sys==="cm")return v;
  if(sys==="us_m")return (v+1)*8/9*2.54+15.87;
  if(sys==="us_w")return (v-.5+1)*8/9*2.54+15.87;
  if(sys==="uk")return (v+1.5)*8/9*2.54+15.87;
  if(sys==="eu")return (v-31)*2/3*2.54+15.87;
}
function fromCm(cm,sys){
  if(sys==="cm")return cm;
  if(sys==="us_m")return (cm-15.87)/2.54*9/8-1;
  if(sys==="us_w")return (cm-15.87)/2.54*9/8-1+.5;
  if(sys==="uk")return (cm-15.87)/2.54*9/8-1.5;
  if(sys==="eu")return (cm-15.87)/2.54*3/2+31;
}
document.getElementById("calc").onclick=()=>{
  const v=+document.getElementById("f0").value,sys=document.getElementById("f1").value;
  if(!v){document.getElementById("mt-status").textContent="Enter a size.";return;}
  const cm=toCm(v,sys);
  ["us_m","us_w","uk","eu","cm"].forEach(s=>{document.getElementById(s).textContent=fromCm(cm,s).toFixed(1);});
  document.getElementById("mt-status").textContent="Approximate conversions.";
};
</script>
