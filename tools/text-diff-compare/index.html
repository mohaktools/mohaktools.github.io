<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=text-tools" style="color:var(--color-primary);text-decoration:none">Text Tools</a>
    <span style="margin:0 6px">/</span>
    <span>Text Diff / Compare</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Text Diff / Compare</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Highlight differences between two blocks of text side by side.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel" style="grid-column:1/-1"><h2 id="tool-input-heading">Compare Texts</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="mt-field"><label for="t1">Original Text</label><textarea id="t1" placeholder="Paste original…" style="min-height:200px"></textarea></div>
<div class="mt-field"><label for="t2">Modified Text</label><textarea id="t2" placeholder="Paste modified…" style="min-height:200px"></textarea></div>
</div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Compare</button><button class="mt-button mt-secondary" id="reset">Clear</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel" style="grid-column:1/-1"><h2>Diff Result</h2>
<div id="diff-out" style="font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all"></div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Text Tools</h2>

  </section>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

function diff(a,b){
  const al=a.split("\n"),bl=b.split("\n");const out=[];
  const m=al.length,n=bl.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=al[i]===bl[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;
  while(i<m||j<n){
    if(i<m&&j<n&&al[i]===bl[j]){out.push({t:"=",l:al[i]});i++;j++;}
    else if(j<n&&(i>=m||dp[i+1][j]>=dp[i][j+1])){out.push({t:"+",l:bl[j]});j++;}
    else{out.push({t:"-",l:al[i]});i++;}
  }
  return out;
}
document.getElementById("calc").onclick=()=>{
  const a=document.getElementById("t1").value,b=document.getElementById("t2").value;
  const d=diff(a,b);
  const el=document.getElementById("diff-out");
  let add=0,rem=0;
  el.innerHTML=d.map(({t,l})=>{
    const esc=l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(t==="+"){add++;return`<span style="display:block;background:rgba(22,167,101,.15);color:var(--color-success,#16a765)">+ ${esc}</span>`;}
    if(t==="-"){rem++;return`<span style="display:block;background:rgba(235,68,90,.1);color:#eb445a">- ${esc}</span>`;}
    return`<span style="display:block;color:var(--color-text-secondary)">  ${esc}</span>`;
  }).join("");
  document.getElementById("mt-status").textContent=`+${add} added  -${rem} removed`;
};
document.getElementById("reset").onclick=()=>{document.getElementById("t1").value="";document.getElementById("t2").value="";document.getElementById("diff-out").innerHTML="";};
</script>
</body>
