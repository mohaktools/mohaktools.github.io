.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}

<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=everyday-utilities" style="color:var(--color-primary);text-decoration:none">Everyday Utilities</a>
    <span style="margin:0 6px">/</span>
    <span>Image Format Converter</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Image Format Converter</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Convert images between PNG, JPG and WebP formats.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Image</h2>
<div class="mt-field"><label for="f0">Select Image (PNG, JPG, WebP, GIF, BMP)</label><input type="file" id="f0" accept="image/*"></div>
<div class="mt-field"><label for="f1">Convert to</label>
<select id="f1"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></div>
<div class="mt-field"><label for="f2">Quality (JPG/WebP, %)</label><input type="range" id="f2" min="10" max="100" value="90"><span id="q-val">90</span></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Convert & Download</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Preview</h2>
<img id="preview" style="max-width:100%;border-radius:10px;display:none" alt="Preview">
<div class="mt-stat-grid" style="margin-top:12px">
<div class="mt-stat"><span>Dimensions</span><strong id="dims">—</strong></div>
<div class="mt-stat"><span>Original Size</span><strong id="orig">—</strong></div>
</div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Everyday Utilities</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/password-generator/" class="mt-related-chip">Password Generator</a><a href="/tools/qr-code-generator/" class="mt-related-chip">QR Code Generator</a><a href="/tools/random-number-generator/" class="mt-related-chip">Random Number Generator</a></div>
  </section>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("f2").oninput=function(){document.getElementById("q-val").textContent=this.value;};
document.getElementById("f0").onchange=()=>{
  const file=document.getElementById("f0").files[0];if(!file)return;
  document.getElementById("orig").textContent=(file.size/1024).toFixed(1)+" KB";
  const img=new Image();img.onload=()=>{document.getElementById("dims").textContent=img.width+"×"+img.height;document.getElementById("preview").src=img.src;document.getElementById("preview").style.display="block";};
  img.src=URL.createObjectURL(file);
};
document.getElementById("calc").onclick=()=>{
  const file=document.getElementById("f0").files[0],fmt=document.getElementById("f1").value,q=+document.getElementById("f2").value/100;
  if(!file){document.getElementById("mt-status").textContent="Select an image.";return;}
  const img=new Image();img.onload=()=>{
    const canvas=document.createElement("canvas");canvas.width=img.width;canvas.height=img.height;
    canvas.getContext("2d").drawImage(img,0,0);
    canvas.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="converted."+fmt.split("/")[1];a.click();document.getElementById("mt-status").textContent="Downloaded!";},fmt,q);
  };img.src=URL.createObjectURL(file);
};
</script>
