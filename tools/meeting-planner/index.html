<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
<title>Meeting Planner | MohakTools</title>
<meta name="description" content="Find a meeting time that works across multiple time zones.">
<meta name="keywords" content="meeting planner, international meeting, schedule across zones">
<link rel="canonical" href="https://mohaktools.com/tools/meeting-planner/">
<meta property="og:title" content="Meeting Planner | MohakTools">
<meta property="og:description" content="Find a meeting time that works across multiple time zones.">
<meta property="og:url" content="https://mohaktools.com/tools/meeting-planner/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MohakTools">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Meeting Planner | MohakTools">
<meta name="twitter:description" content="Find a meeting time that works across multiple time zones.">
<script src="/assets/js/tools-registry.js" defer></script>
<style>
.mt-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg,16px);padding:20px;margin-bottom:16px}
.mt-field{margin-bottom:14px}
.mt-field label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.3px}
.mt-field input[type="text"],.mt-field input[type="number"],.mt-field input[type="email"],.mt-field input[type="date"],.mt-field input[type="time"],.mt-field input[type="datetime-local"],.mt-field input[type="color"],.mt-field input[type="range"],.mt-field input[type="file"],.mt-field select,.mt-field textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
.mt-field input:focus,.mt-field select:focus,.mt-field textarea:focus{border-color:var(--color-primary)}
.mt-field textarea{resize:vertical;min-height:120px;font-family:inherit}
.mt-output{display:block;width:100%;min-height:160px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-text);font:13px/1.6 inherit;resize:vertical;box-sizing:border-box}
.mt-button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mt-button{padding:10px 20px;border-radius:var(--radius-md,10px);font:600 14px/1 inherit;cursor:pointer;border:none;transition:opacity .2s,transform .1s;white-space:nowrap}
.mt-button:active{transform:scale(.97)}
.mt-primary{background:var(--color-primary,#4a86e8);color:#fff}
.mt-secondary{background:var(--color-surface-secondary,#f0f0f0);color:var(--color-text)}
.mt-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mt-stat{background:var(--color-surface-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md,10px);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mt-stat span{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mt-stat strong{font-size:20px;font-weight:700;color:var(--color-text)}
.mt-status{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin-top:8px}
.mt-help{font-size:12px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5}
.mt-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mt-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text);cursor:pointer;user-select:none}
.mt-option input{accent-color:var(--color-primary)}
.mt-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.mt-tool-grid{grid-template-columns:1fr}.mt-button{padding:10px 14px;font-size:13px}}
</style>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/tool-page.css">
</head>
<body>
<div id="site-header"></div>

<main class="tool-main" style="max-width:860px;margin:0 auto;padding:20px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--color-text-secondary);margin-bottom:16px">
    <a href="/" style="color:var(--color-primary);text-decoration:none">Home</a>
    <span style="margin:0 6px">/</span>
    <a href="/tools/?category=time-tools" style="color:var(--color-primary);text-decoration:none">Time & Productivity</a>
    <span style="margin:0 6px">/</span>
    <span>Meeting Planner</span>
  </nav>

  <header style="margin-bottom:24px">
    <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--color-text);margin:0 0 8px">Meeting Planner</h1>
    <p style="font-size:15px;color:var(--color-text-secondary);line-height:1.6;max-width:640px;margin:0">Find a meeting time that works across multiple time zones.</p>
  </header>

  <div class="mt-tool-grid">
    
<section class="mt-panel"><h2 id="tool-input-heading">Proposed Time</h2>
<div class="mt-field"><label for="f0">Date & Time (your local)</label><input type="datetime-local" id="f0"></div>
<div class="mt-field"><label>Time zones to check</label>
<div class="mt-options">
<label class="mt-option"><input type="checkbox" value="America/New_York" checked> New York (ET)</label>
<label class="mt-option"><input type="checkbox" value="Europe/London" checked> London (GMT/BST)</label>
<label class="mt-option"><input type="checkbox" value="Asia/Kolkata" checked> India (IST)</label>
<label class="mt-option"><input type="checkbox" value="Asia/Tokyo" checked> Tokyo (JST)</label>
<label class="mt-option"><input type="checkbox" value="America/Los_Angeles"> LA (PT)</label>
<label class="mt-option"><input type="checkbox" value="Asia/Dubai"> Dubai (GST)</label>
<label class="mt-option"><input type="checkbox" value="Australia/Sydney"> Sydney (AEST)</label>
<label class="mt-option"><input type="checkbox" value="Europe/Paris"> Paris (CET)</label>
</div></div>
<div class="mt-button-row"><button class="mt-button mt-primary" id="calc">Check Times</button><button class="mt-button mt-secondary" id="now">Use Now</button></div>
<p class="mt-status" id="mt-status" role="status" aria-live="polite"></p></section>
<section class="mt-panel"><h2>Time in Each Zone</h2>
<div id="tzout" style="display:flex;flex-direction:column;gap:8px"></div></section>
  </div>

  <section style="margin-top:32px">
    <h2 style="font-size:14px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Related Tools in Time & Productivity</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><a href="/tools/stopwatch/" class="mt-related-chip">Stopwatch</a><a href="/tools/countdown-timer/" class="mt-related-chip">Countdown Timer</a><a href="/tools/world-clock/" class="mt-related-chip">World Clock</a></div>
  </section>
</main>

<div id="site-footer"></div>

  <script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/header.js" defer></script>
<script src="/assets/js/footer.js" defer></script>
<script>

document.getElementById("now").onclick=()=>{
  const n=new Date();const pad=v=>String(v).padStart(2,"0");
  document.getElementById("f0").value=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T"+pad(n.getHours())+":"+pad(n.getMinutes());
};
document.getElementById("calc").onclick=()=>{
  const val=document.getElementById("f0").value;
  if(!val){document.getElementById("mt-status").textContent="Select date and time.";return;}
  const dt=new Date(val);
  const zones=[...document.querySelectorAll(".mt-options input:checked")].map(c=>c.value);
  if(!zones.length){document.getElementById("mt-status").textContent="Select at least one time zone.";return;}
  const out=document.getElementById("tzout");out.innerHTML="";
  zones.forEach(tz=>{
    const str=dt.toLocaleString("en-US",{timeZone:tz,weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",timeZoneName:"short"});
    const h=dt.toLocaleString("en-US",{timeZone:tz,hour12:false,hour:"2-digit"});
    const hr=+h;const ok=hr>=8&&hr<20;
    const div=document.createElement("div");
    div.style.cssText="padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md,10px);background:var(--color-surface-secondary);display:flex;justify-content:space-between;align-items:center;gap:8px";
    div.innerHTML=`<span style="font-size:13px;color:var(--color-text-secondary)">${tz.split("/").pop().replace("_"," ")}</span><span style="font-size:14px;font-weight:600;color:var(--color-text)">${str}</span><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:${ok?"var(--color-success,#16a765)":"#e74c3c"};color:#fff">${ok?"OK":"Off hours"}</span>`;
    out.appendChild(div);
  });
  document.getElementById("mt-status").textContent="";
};
</script>
</body>
</html>
