**Bold** and *italic* text…" style="font-family:monospace"></textarea></div>

<script src="/assets/js/footer.js" defer></script>
<script>

function mdToHtml(md){
  let h=md
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^#{6} (.+)$/gm,"<h6>$1</h6>").replace(/^#{5} (.+)$/gm,"<h5>$1</h5>")
    .replace(/^#{4} (.+)$/gm,"<h4>$1</h4>").replace(/^#{3} (.+)$/gm,"<h3>$1</h3>")
    .replace(/^#{2} (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,"<a href=\"$2\" target=\"_blank\">$1</a>")
    .replace(/^- (.+)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>)/gs,"<ul>$1</ul>")
    .replace(/^([^<\n].+)$/gm,"<p>$1</p>")
    .replace(/\n{2,}/g,"\n");
  return h;
}
document.getElementById("calc").onclick=()=>{
  const md=document.getElementById("mt-input").value;
  const html=mdToHtml(md);
  document.getElementById("preview").innerHTML=html;
  document.getElementById("mt-output").value=html;
  document.getElementById("mt-status").textContent="";
};
document.getElementById("copyHtml").onclick=()=>{const o=document.getElementById("mt-output").value;if(o)navigator.clipboard.writeText(o).then(()=>document.getElementById("mt-status").textContent="HTML copied!");};
document.getElementById("reset").onclick=()=>{document.getElementById("mt-input").value="";document.getElementById("mt-output").value="";document.getElementById("preview").innerHTML="";};
document.getElementById("mt-input").addEventListener("input",()=>{const md=document.getElementById("mt-input").value;document.getElementById("preview").innerHTML=mdToHtml(md);document.getElementById("mt-output").value=mdToHtml(md);});
</script>
