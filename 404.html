 
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Page Not Found (404) | MohakTools</title>
  <meta name="description" content="The page you are looking for could not be found. Find the right calculator, converter, or online tool on MohakTools.">
  <meta name="robots" content="noindex, follow">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="/favicon.webp" type="image/webp">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/global.css">

  <script src="/assets/js/theme.js"></script>

  <style>
    .error-page {
      display: grid;
      min-height: 65vh;
      place-items: center;
      padding-block: 48px 72px;
    }

    .error-content {
      width: 100%;
      max-width: 680px;
      margin-inline: auto;
      text-align: center;
    }

    .error-code {
      margin: 0 0 8px;
      color: var(--color-primary);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .error-content h1 {
      margin: 0 0 14px;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      line-height: 1.25;
    }

    .error-description {
      max-width: 520px;
      margin: 0 auto 26px;
      color: var(--color-text-secondary);
      line-height: 1.75;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .error-actions .btn {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .error-search {
      max-width: 520px;
      margin-inline: auto;
      text-align: left;
    }

    .error-search label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .error-search-row {
      display: flex;
      gap: 10px;
    }

    .error-search input {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 10px 13px;
      border: 1px solid var(--color-input-border);
      border-radius: var(--radius-md);
      background: var(--color-input-bg);
      color: var(--color-text);
      font: inherit;
    }

    .error-search input::placeholder {
      color: var(--color-text-secondary);
    }

    .error-search input:focus-visible,
    .error-search button:focus-visible,
    .error-actions a:focus-visible,
    .error-suggestions a:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
    }

    .error-search button {
      flex-shrink: 0;
      min-height: 46px;
    }

    .error-status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .error-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .error-suggestions a {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-primary);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .error-suggestions a:hover {
      background: var(--color-surface);
    }

    @media (max-width: 480px) {
      .error-page {
        min-height: 55vh;
        padding-block: 36px 48px;
      }

      .error-search-row {
        flex-direction: column;
      }

      .error-search button {
        width: 100%;
      }

      .error-actions {
        flex-direction: column;
      }

      .error-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="container error-page">
    <section class="error-content" aria-labelledby="error-heading">
      <p class="error-code" aria-hidden="true">404</p>

      <h1 id="error-heading">Page not found</h1>

      <p class="error-description">
        The page you're looking for may have been moved, removed, or
        may no longer be available. Search our tools or return to the
        homepage to continue.
      </p>

      <div class="error-actions">
        <a class="btn" href="/">Back to homepage</a>
        <a class="btn" href="/tools/">Browse all tools</a>
      </div>

      <form class="error-search" id="error-search-form" role="search">
        <label for="error-search-input">Find a tool</label>

        <div class="error-search-row">
          <input
            type="search"
            id="error-search-input"
            name="q"
            placeholder="Search calculators, converters..."
            autocomplete="off"
            aria-describedby="error-search-status"
          >

          <button class="btn" type="submit">Search</button>
        </div>

        <p
          class="error-status"
          id="error-search-status"
          role="status"
          aria-live="polite"
        >Search the MohakTools directory to find what you need.</p>

        <div class="error-suggestions" id="error-suggestions"></div>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/tools-registry.js" defer></script>
  <script src="/assets/js/header.js" defer></script>
  <script src="/assets/js/footer.js" defer></script>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("error-search-form");
      const input = document.getElementById("error-search-input");
      const status = document.getElementById("error-search-status");
      const suggestions = document.getElementById("error-suggestions");

      function getToolName(tool) {
        return tool.name || tool.title || "";
      }

      function getToolUrl(tool) {
        const url = tool.url || tool.href || tool.path;

        if (typeof url !== "string" || !url.startsWith("/")) {
          return "";
        }

        if (url.startsWith("//")) {
          return "";
        }

        return url;
      }

      function getAllTools() {
        const registry = window.MohakToolsRegistry;

        if (!registry || typeof registry.getAll !== "function") {
          return null;
        }

        const tools = registry.getAll();
        return Array.isArray(tools) ? tools : null;
      }

      function renderSuggestions(query) {
        suggestions.replaceChildren();

        const tools = getAllTools();

        if (!tools) {
          status.textContent =
            "The tool directory is unavailable right now. Try browsing all tools.";
          return;
        }

        const normalizedQuery = query.trim().toLowerCase();

        if (!normalizedQuery) {
          status.textContent =
            "Enter a tool name or keyword to search the directory.";
          return;
        }

        const matches = tools.filter(tool => {
          const name = getToolName(tool);
          const description = tool.description || "";
          const category = tool.categoryName || tool.category || "";

          return `${name} ${description} ${category}`
            .toLowerCase()
            .includes(normalizedQuery);
        }).filter(tool => getToolName(tool) && getToolUrl(tool)).slice(0, 5);

        if (matches.length === 0) {
          status.textContent =
            "No matching tools found. Try another keyword or browse all tools.";
          return;
        }

        matches.forEach(tool => {
          const link = document.createElement("a");
          link.href = getToolUrl(tool);
          link.textContent = getToolName(tool);
          suggestions.appendChild(link);
        });

        status.textContent =
          `Found ${matches.length} matching ${matches.length === 1 ? "tool" : "tools"}.`;
      }

      form.addEventListener("submit", event => {
        event.preventDefault();

        const query = input.value.trim();

        if (!query) {
          status.textContent = "Enter a tool name or keyword first.";
          input.focus();
          return;
        }

        const registry = window.MohakToolsRegistry;

        if (registry && registry.ready && typeof registry.ready.then === "function") {
          registry.ready.then(() => renderSuggestions(query)).catch(() => {
            status.textContent =
              "Search is temporarily unavailable. Try browsing all tools.";
          });
          return;
        }

        renderSuggestions(query);
      });

      input.addEventListener("input", () => {
        if (!input.value.trim()) {
          suggestions.replaceChildren();
          status.textContent =
            "Search the MohakTools directory to find what you need.";
        }
      });

      function initializeSearch() {
        const registry = window.MohakToolsRegistry;

        if (!registry) {
          status.textContent =
            "Search is unavailable right now. You can still browse all tools.";
          return;
        }

        if (registry.ready && typeof registry.ready.then === "function") {
          registry.ready.then(() => {
            status.textContent =
              "Search the MohakTools directory to find what you need.";
          }).catch(() => {
            status.textContent =
              "Search is unavailable right now. You can still browse all tools.";
          });
        }
      }

      initializeSearch();
    })();
  </script>
</body>
</html>
